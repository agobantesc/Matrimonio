<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Evy y Ricardo — ¡Nos casamos! 💍">
<meta property="og:description" content="Matrimonio civil · Sábado 26 de septiembre, desde las 12:00 hrs · Casa Zucca, Providencia. Toca para abrir tu invitación.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://agobantesc.github.io/matrimonio/">
<meta property="og:image" content="https://agobantesc.github.io/matrimonio/portada.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">
<meta name="description" content="Invitación al matrimonio civil de Evy y Ricardo — Sábado 26 de septiembre, 12:00 hrs.">
<link rel="preload" as="image" href="sobre.webp">
<link rel="preload" as="image" href="solapa.webp">
<link rel="preload" as="image" href="sello.webp">
<title>Evy &amp; Ricardo — Nos casamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #efe9dc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 10px;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
  }

  /* ============ ESCENA DEL SOBRE ============ */
  .escena {
    position: fixed;
    inset: 0;
    background: #efe9dc;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 1s ease, transform 1s ease;
  }
  .escena.desvanecer {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }
  .marco-sobre {
    position: relative;
    display: inline-block;
    line-height: 0;
    filter: drop-shadow(0 14px 34px rgba(60,55,40,.22));
  }
  .marco-sobre img.fondo-sobre {
    display: block;
    max-height: min(94vh, 94svh);
    max-width: 94vw;
    width: auto;
    height: auto;
    border-radius: 10px;
    position: relative;
    z-index: 0;
  }

  /* --- interior del sobre (detrás de todo) --- */
  .capa-interior {
    position: absolute;
    left: 3.74%; top: 43.92%;
    width: 93.04%; height: 40.81%;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,105,70,.18), transparent 55%),
      linear-gradient(180deg, #e2d9c4, #d8cdb4 60%, #cfc3a8);
    border-radius: 4px;
    box-shadow: inset 0 6px 14px rgba(90,75,40,.22);
  }

  /* --- ventana de la carta (recorta por abajo, deja salir por arriba) --- */
  .ventana {
    position: absolute;
    left: 3.74%;
    width: 93.04%;
    top: 4%;
    height: 80.73%;          /* llega justo al borde inferior del sobre (84.73%) */
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
  }
  .carta {
    position: absolute;
    left: 21%;
    width: 58%;
    top: 49.6%;              /* dentro del sobre */
    transition: transform 1.35s cubic-bezier(.22,.85,.3,1);
    filter: drop-shadow(0 6px 16px rgba(80,65,30,.28));
  }
  .carta img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #d8cba3;
    border-radius: 4px;
  }
  .carta-fuera .carta { transform: translateY(-56%); }

  /* --- frente del sobre: bolsillo + solapa (con perspectiva) --- */
  .capa-frente {
    position: absolute;
    left: 3.74%; top: 43.92%;
    width: 93.04%; height: 40.81%;
    z-index: 3;
  }
  .capa-solapa {
    position: absolute;
    left: 3.74%; top: 43.92%;
    width: 93.04%; height: 40.81%;
    z-index: 4;
    perspective: 1600px;
    pointer-events: none;
    transition: z-index 0s .5s;
  }
  .solapa-abierta .capa-solapa { z-index: 1; }
  .bolsillo {
    position: absolute; inset: 0;
    background-image: url('solapa.webp');
    background-size: 100% 100%;
    clip-path: polygon(0 0, 49.64% 62.71%, 100% 0, 100% 100%, 0 100%);
    z-index: 2;
  }
  .solapa {
    position: absolute; inset: 0;
    clip-path: polygon(-1% -1%, 101% -1%, 49.64% 63.5%);
    transform-origin: 50% 0%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.45,.05,.35,1);
  }
  .solapa .cara-frente-solapa,
  .solapa .cara-dorso-solapa {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .solapa .cara-frente-solapa {
    background-image: url('solapa.webp');
    background-size: 100% 100%;
  }
  .solapa .cara-dorso-solapa {
    transform: rotateX(180deg);
    background: linear-gradient(0deg, #ece3cf, #e0d6bf 70%, #d6cab0);
  }
  .solapa-abierta .solapa {
    transform: rotateX(178deg);
  }

  /* --- sello de lacre --- */
  .sello-vivo {
    position: absolute;
    left: 49.92%;
    top: 65.19%;
    width: 21.73%;
    transform: translate(-50%, -50%);
    transition: transform .7s cubic-bezier(.3,.7,.4,1), opacity .55s ease .1s;
    animation: pulso 2.6s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes pulso {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.045); }
  }
  .sello-roto .sello-vivo {
    animation: none;
    transform: translate(-50%, -50%) scale(1.5) rotate(-10deg);
    opacity: 0;
  }

  /* ============ INVITACIÓN ============ */
  .invitacion {
    position: relative;
    width: 100%;
    max-width: 520px;
    container-type: inline-size;
    box-shadow: 0 18px 50px rgba(60,55,40,.30);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(26px) scale(.96);
    transition: opacity .9s ease, transform .9s ease;
  }
  .invitacion.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .invitacion > img {
    display: block;
    width: 100%;
    height: auto;
  }

  .contador {
    position: absolute;
    top: 88.95%;
    left: 14%;
    width: 72%;
    height: 3.05%;
    background: #f7f3ee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4c5541;
    font-weight: 700;
    font-size: 4.4cqw;
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .contador .linea { display: inline-block; line-height: 1; }
  .contador .guion {
    letter-spacing: 0; text-indent: 0;
    margin: 0 .5em;
    color: #c19648;
    font-weight: 500;
    vertical-align: baseline;
  }
  .contador .numero {
    color: #c19648;
    font-size: 1.2em;
    letter-spacing: .04em;
    line-height: 1;
    vertical-align: baseline;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
  }

  .zona-boton {
    position: absolute;
    top: 93.9%;
    left: 13%;
    width: 74%;
    height: 4.35%;
    background: #f7f3ee;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3%;
  }
  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 100%;
    border: 1px solid #c19648;
    background: transparent;
    color: #4c5541;
    text-decoration: none;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 2.45cqw;
    letter-spacing: .22em;
    text-indent: .22em;
    text-transform: uppercase;
    white-space: nowrap;
    transition: background .25s ease, color .25s ease;
  }
  .boton:hover, .boton:focus-visible {
    background: #c19648;
    color: #f7f3ee;
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .escena, .invitacion, .sello-vivo, .solapa, .carta { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <!-- Sobre -->
  <div class="escena" id="escena" role="button" tabindex="0" aria-label="Abrir la invitación">
    <div class="marco-sobre" id="marco">
      <img class="fondo-sobre" src="sobre.webp" decoding="async" fetchpriority="high" alt="Sobre sellado de la invitación de Evy y Ricardo. Toca para abrir.">
      <div class="capa-interior"></div>
      <div class="ventana">
        <div class="carta"><img id="img-carta" decoding="async" alt=""></div>
      </div>
      <div class="capa-frente">
        <div class="bolsillo"></div>
      </div>
      <div class="capa-solapa">
        <div class="solapa">
          <div class="cara-frente-solapa"></div>
          <div class="cara-dorso-solapa"></div>
        </div>
      </div>
      <img class="sello-vivo" src="sello.webp" alt="" aria-hidden="true">
    </div>
  </div>

  <!-- Invitación -->
  <div class="invitacion" id="invitacion">
    <img id="img-inv" decoding="async" alt="Invitación de matrimonio civil de Evy y Ricardo — Sábado 26 de septiembre, 12:00 hrs, Casa Zucca, Providencia">

    <div class="contador" aria-live="polite">
      <span class="linea"><span class="guion">—</span><span id="texto-contador">Faltan <span class="numero">55</span> días</span><span class="guion">—</span></span>
    </div>

    <div class="zona-boton">
      <a class="boton" href="https://docs.google.com/forms/d/1DP7bCRjSWRdjb0D2ML4141pSakAi7VR6V37kpp2gFVI/viewform" target="_blank" rel="noopener">Confirmar asistencia</a>
      <a class="boton" href="https://novios.falabella.com/info-evento/evento?codigoEvento=2105817" target="_blank" rel="noopener">Lista de regalos</a>
    </div>
  </div>

<script>
  // Imagen de la invitación (una sola copia, usada en la carta y en la vista final)
  const INV = 'invitacion.webp';
  const precarga = new Image();
  precarga.src = INV;                       // se descarga mientras miran el sobre
  document.getElementById('img-inv').src = INV;
  document.getElementById('img-carta').src = INV;

  // --- Secuencia de apertura ---
  const escena = document.getElementById('escena');
  const marco = document.getElementById('marco');
  const invitacion = document.getElementById('invitacion');
  let abierto = false;

  function abrir() {
    if (abierto) return;
    abierto = true;
    const reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducido) {
      escena.remove();
      invitacion.classList.add('visible');
      return;
    }
    marco.classList.add('sello-roto');                                   // 1. se rompe el lacre
    setTimeout(() => marco.classList.add('solapa-abierta'), 350);        // 2. se abre la solapa
    setTimeout(() => marco.classList.add('carta-fuera'), 1150);          // 3. sale la carta
    setTimeout(() => {                                                   // 4. transición final
      escena.classList.add('desvanecer');
      invitacion.classList.add('visible');
    }, 2350);
    setTimeout(() => escena.remove(), 3500);
  }
  escena.addEventListener('click', abrir);
  escena.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
  });

  // --- Contador en tiempo real ---
  const objetivo = new Date('2026-09-26T12:00:00-03:00');
  function actualizar() {
    const diff = objetivo - Date.now();
    const el = document.getElementById('texto-contador');
    if (diff <= 0) { el.innerHTML = 'Hoy es el gran día'; return; }
    const dias = Math.floor(diff / 86400000);
    if (dias >= 1) {
      el.innerHTML = (dias === 1 ? 'Falta ' : 'Faltan ') +
        '<span class="numero">' + dias + '</span>' +
        (dias === 1 ? ' día' : ' días');
    } else {
      const horas = Math.floor(diff / 3600000);
      const min = Math.floor((diff % 3600000) / 60000);
      el.innerHTML = 'Faltan <span class="numero">' + horas + '</span> h <span class="numero">' + String(min).padStart(2,'0') + '</span> min';
    }
  }
  actualizar();
  let reloj = setInterval(actualizar, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(reloj);
    } else {
      actualizar();
      clearInterval(reloj);
      reloj = setInterval(actualizar, 30000);
    }
  });
</script>
</body>
</html>
